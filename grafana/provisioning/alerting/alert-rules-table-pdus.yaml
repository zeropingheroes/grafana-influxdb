        - uid: bfeglxz4vww4u1i
          title: Device not reporting
          for: 0s
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 86400
                to: 0
              datasourceUid: bejsypfy2b3eoa
              model:
                intervalMs: 30000
                maxDataPoints: 43200
                query: |
                  from(bucket: "power")
                    |> range(start: v.timeRangeStart, stop: v.timeRangeStop)
                    |> filter(fn: (r) => r["_measurement"] == "table-pdus")
                    |> filter(fn: (r) => r["_field"] == "volts")
                    |> last()
                    |> map(fn: (r) => ({r with _value: float(v: int(v: now()) - int(v: r._time)) / 60000000000.0}))
                    |> keep(columns: ["_time", "_value", "device"])
                refId: A
            - refId: B
              datasourceUid: __expr__
              model:
