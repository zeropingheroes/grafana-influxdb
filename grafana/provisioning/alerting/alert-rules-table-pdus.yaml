                from: 300
                to: 0
              datasourceUid: bejsypfy2b3eoa
              model:
                intervalMs: 30000
                maxDataPoints: 43200
                query: "from(bucket: \"power\")\r\n  |> range(start: v.timeRangeStart, stop: v.timeRangeStop)\r\n  |> filter(fn: (r) => r[\"_measurement\"] == \"table-pdus\")\r\n  |> filter(fn: (r) => r[\"_field\"] == \"volts\")\r\n  |> aggregateWindow(every: v.windowPeriod, fn: last, createEmpty: false)\r\n  |> yield(name: \"last\")"
                refId: A
