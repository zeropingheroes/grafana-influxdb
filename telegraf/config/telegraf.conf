[agent]
    omit_hostname = true
    interval = "30s"
    flush_interval = "45s"

[[inputs.mqtt_consumer]]
    servers = ["tcp://mosquitto:1883"]
    username = "$TELEGRAF_MQTT_USERNAME"
    password = "$TELEGRAF_MQTT_PASSWORD"
    topics = ["distro/+/status/em1:0", "distro/+/status/em1:1", "distro/+/status/em1:2"]
    topic_tag = ""
    data_format = "json_v2"
    name_override = "distros"

    [[inputs.mqtt_consumer.topic_parsing]]
        topic = "distro/+/status/+"
        tags = "_/distro_id/_/phase"

    [[inputs.mqtt_consumer.json_v2]]

        [[inputs.mqtt_consumer.json_v2.field]]
        path = "voltage"
        rename = "volts"
        type = "float"

        [[inputs.mqtt_consumer.json_v2.field]]
        path = "current"
        rename = "amps"
        type = "float"

        [[inputs.mqtt_consumer.json_v2.field]]
        path = "act_power"
        rename = "watts"
        type = "float"

        [[inputs.mqtt_consumer.json_v2.field]]
        path = "aprt_power"
        rename = "volt_amps"
        type = "float"

        [[inputs.mqtt_consumer.json_v2.field]]
        path = "pf"
        rename = "power_factor"
        type = "float"

        [[inputs.mqtt_consumer.json_v2.field]]
        path = "freq"
        rename = "frequency"
        type = "float"

[[inputs.mqtt_consumer]]
    servers = ["tcp://mosquitto:1883"]
    username = "$TELEGRAF_MQTT_USERNAME"
    password = "$TELEGRAF_MQTT_PASSWORD"
    topics = [
        "distro/+/status/em1data:0", 
        "distro/+/status/em1data:1", 
        "distro/+/status/em1data:2"
    ]
    topic_tag = ""
    data_format = "json_v2"
    
    name_override = "distros"

    [[inputs.mqtt_consumer.topic_parsing]]
        topic = "distro/+/status/+"
        tags = "_/distro_id/_/phase"

    [[inputs.mqtt_consumer.json_v2]]

        [[inputs.mqtt_consumer.json_v2.field]]
        path = "total_act_energy"
        rename = "consumed"
        type = "float"

        [[inputs.mqtt_consumer.json_v2.field]]
        path = "total_act_ret_energy"
        rename = "returned"
        type = "float"

[[inputs.snmp]]
  agents = ["table-pdu1.lan.zeropingheroes.co.uk"]
  version = 2
  community = "$SNMP_COMMUNITY"
  agent_host_tag = "source"
  tagexclude = ["source"]
  name = "power"

  [inputs.snmp.tags]
    pdu = "pdu1"

  [[inputs.snmp.field]]
    name = "volts"
    oid  = "1.3.6.1.4.1.38218.1.6.1.0"
    conversion = "float(1)"

  [[inputs.snmp.field]]
    name = "amps"
    oid  = "1.3.6.1.4.1.38218.1.6.2.0"
    conversion = "float(2)"

  [[inputs.snmp.field]]
    name = "kilowatt-hours"
    oid  = "1.3.6.1.4.1.38218.1.6.3.0"
    conversion = "float(1)"

  [[inputs.snmp.field]]
    name = "watts"
    oid  = "1.3.6.1.4.1.38218.1.6.4.0"

  [[inputs.snmp.field]]
    name = "temperature"
    oid  = "1.3.6.1.4.1.38218.1.6.5.0"
    conversion = "float(2)"

  [[inputs.snmp.field]]
    name = "power-factor"
    oid  = "1.3.6.1.4.1.38218.1.6.8.0"
    conversion = "float(3)"

  [[inputs.snmp.field]]
    name = "frequency"
    oid  = "1.3.6.1.4.1.38218.1.6.9.0"
    conversion = "float(1)"


